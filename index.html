<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Studio | Cinematic Chroma Key</title>
    <style>
        /* Moderný profesionálny dark-theme */
        :root {
            --bg-main: #09090b;
            --bg-panel: #18181b;
            --bg-input: #27272a;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Povinné tlačidlo "Späť" podľa zadania */
        .header-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }
        .back-button {
            background-color: var(--bg-panel);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-button:hover {
            background-color: var(--bg-input);
            border-color: var(--text-muted);
        }

        /* Hlavný layout štúdia */
        .studio-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* Ľavý panel: Ovládanie */
        .control-panel {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child { border-bottom: none; padding-bottom: 0; }
        
        h2 { font-size: 1.1rem; margin: 0; color: var(--text-main); font-weight: 600; letter-spacing: 0.5px; }
        p.subtitle { margin: -5px 0 10px 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        /* Tlačidlá */
        .btn {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { border-color: var(--accent); background-color: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .btn.primary { background-color: var(--accent); color: #000; border: none; font-weight: 700; }
        .btn.primary:hover { background-color: var(--accent-hover); }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background-color: var(--danger); color: white; }
        .btn.danger.recording { animation: pulse 1.5s infinite; background-color: var(--danger); color: white;}
        input[type="file"] { display: none; }

        /* Slidery a Selecty */
        label { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 5px; }
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }
        select:focus { border-color: var(--accent); }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-main);
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Pravý panel: Canvas / Náhľad */
        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-wrapper {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
            transition: filter 0.3s ease;
        }
        .canvas-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Responzivita */
        @media (max-width: 900px) {
            .studio-container { grid-template-columns: 1fr; }
            .preview-panel { order: -1; } /* Náhľad bude na mobile hore */
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/" class="back-button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Späť na portál
        </a>
    </div>

    <div class="studio-container">
        
        <div class="control-panel">
            
            <div class="panel-section">
                <h2>1. Zdroj obrazu (Popredie)</h2>
                <p class="subtitle">Nahraj súbor so zeleným plátnom alebo zapni live kameru.</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <label class="btn">
                        🎥 Súbor
                        <input type="file" id="fgUpload" accept="image/*,video/*">
                    </label>
                    <button class="btn" id="webcamBtn">📷 Webkamera</button>
                </div>
            </div>

            <div class="panel-section">
                <h2>2. Prostredie (Pozadie)</h2>
                <p class="subtitle">Vlož filmové prostredie alebo scenériu.</p>
                <label class="btn">
                    🖼️ Nahrať obrázok pozadia
                    <input type="file" id="bgUpload" accept="image/*">
                </label>
            </div>

            <div class="panel-section">
                <h2>3. VFX & Color Grading</h2>
                
                <div>
                    <label for="tolerance"><span>Tolerancia kľúčovania</span> <span id="tolValue">100</span></label>
                    <input type="range" id="tolerance" min="0" max="255" value="100">
                </div>

                <div style="margin-top: 15px;">
                    <label for="cinematicFilter">Filmový filter (Post-process)</label>
                    <select id="cinematicFilter">
                        <option value="none">Bez filtra (Natural)</option>
                        <option value="contrast(1.2) saturate(1.3)">Akčný Thriller</option>
                        <option value="grayscale(100%) contrast(1.5)">Neo-Noir (Čiernobiele)</option>
                        <option value="sepia(0.8) hue-rotate(90deg) saturate(1.5)">Sci-Fi / Matrix</option>
                        <option value="brightness(0.8) sepia(0.3) saturate(0.8)">Post-Apo</option>
                    </select>
                </div>
            </div>

            <div class="panel-section">
                <h2>4. Export</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <button class="btn" id="downloadBtn">💾 Snímka (.png)</button>
                    <button class="btn danger" id="recordBtn">🔴 Video (.webm)</button>
                </div>
                <button class="btn" id="resetBtn" style="border-color: var(--border);">🔄 Resetovať štúdio</button>
            </div>

        </div>

        <div class="preview-panel">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="1280" height="720" style="background: #000;"></canvas>
                <div class="canvas-hint" id="canvasHint">Kliknutím na obraz zmeníš farbu, ktorá sa má vymazať</div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let fgImage = new Image();
        let bgImage = new Image();
        let fgVideo = document.createElement('video');
        fgVideo.muted = true;
        fgVideo.loop = true;
        fgVideo.setAttribute('playsinline', ''); // Pre mobily

        let fgLoaded = false;
        let bgLoaded = false;
        let isVideoMode = false;
        let isWebcamMode = false;
        let animationFrameId;
        let currentStream = null;

        // Default farba kľúčovania (Zelená)
        let targetColor = { r: 0, g: 255, b: 0 }; 
        
        // Elementy
        const toleranceSlider = document.getElementById('tolerance');
        const tolValue = document.getElementById('tolValue');
        const cinematicFilter = document.getElementById('cinematicFilter');
        const downloadBtn = document.getElementById('downloadBtn');
        const recordBtn = document.getElementById('recordBtn');
        const resetBtn = document.getElementById('resetBtn');
        const webcamBtn = document.getElementById('webcamBtn');
        const canvasHint = document.getElementById('canvasHint');

        // Premenné pre nahrávanie videa
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // Pomocná funkcia na zastavenie zdrojov
        function stopMediaSources() {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            fgVideo.pause();
            fgVideo.removeAttribute('src');
            fgVideo.load();
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // 1. Nahrať popredie (Súbor)
        document.getElementById('fgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            stopMediaSources();
            isWebcamMode = false;
            webcamBtn.style.borderColor = "var(--border)";
            webcamBtn.style.color = "var(--text-main)";
            
            const fileURL = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                isVideoMode = true;
                fgVideo.src = fileURL;
                fgVideo.onloadeddata = () => {
                    canvas.width = fgVideo.videoWidth;
                    canvas.height = fgVideo.videoHeight;
                    fgLoaded = true;
                    fgVideo.play();
                    renderVideoLoop();
                };
            } else {
                isVideoMode = false;
                fgImage.onload = () => {
                    canvas.width = fgImage.width;
                    canvas.height = fgImage.height;
                    fgLoaded = true;
                    processFrame(fgImage);
                }
                fgImage.src = fileURL;
            }
        });

        // 2. Zapnúť Webkameru (Nová funkcia)
        webcamBtn.addEventListener('click', async function() {
            try {
                stopMediaSources();
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                currentStream = stream;
                fgVideo.srcObject = stream;
                isVideoMode = true;
                isWebcamMode = true;
                
                // Zvýraznenie tlačidla, že je kamera aktívna
                this.style.borderColor = "var(--accent)";
                this.style.color = "var(--accent)";

                fgVideo.onloadeddata = () => {
                    canvas.width = fgVideo.videoWidth;
                    canvas.height = fgVideo.videoHeight;
                    fgLoaded = true;
                    fgVideo.play();
                    renderVideoLoop();
                };
            } catch (err) {
                alert("Nepodarilo sa spustiť webkameru. Skontroluj povolenia prehliadača.");
                console.error(err);
            }
        });

        // 3. Nahrať pozadie
        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            bgImage.onload = () => {
                bgLoaded = true;
                if(!isVideoMode) processFrame(fgImage);
            }
            bgImage.src = URL.createObjectURL(file);
        });

        // Interakcie UX
        toleranceSlider.addEventListener('input', function() {
            tolValue.textContent = this.value;
            if (!isVideoMode && fgLoaded) processFrame(fgImage);
        });

        cinematicFilter.addEventListener('change', function() {
            canvas.style.filter = this.value;
            if (!isVideoMode && fgLoaded) {
                // Prekreslenie pre statický obrázok pri zmene filtra (aby to aplikovalo hneď)
                ctx.filter = this.value;
                processFrame(fgImage);
                ctx.filter = 'none';
            }
        });

        // Kvapátko (Výber farby kliknutím)
        canvas.addEventListener('click', function(e) {
            if (!fgLoaded) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            let source = isVideoMode ? fgVideo : fgImage;
            // Vykreslíme surový frame na zistenie farby
            ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
            
            // UI Hint zmizne po prvom kliknutí
            canvasHint.style.opacity = '0';
            
            if(!isVideoMode) processFrame(fgImage);
        });

        // Jadro: Video Slučka
        function renderVideoLoop() {
            if (!isVideoMode) return;
            processFrame(fgVideo);
            animationFrameId = requestAnimationFrame(renderVideoLoop);
        }

        // Jadro: Spracovanie Snímky (Chroma Key + Spill Suppression)
        function processFrame(source) {
            if (!fgLoaded) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Kreslenie pozadia
            if (bgLoaded) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            // 2. Príprava objektu
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            
            // Ak je to webkamera, obraz zrkadlovo otočíme pre lepší pocit
            if (isWebcamMode) {
                tempCtx.translate(canvas.width, 0);
                tempCtx.scale(-1, 1);
            }
            tempCtx.drawImage(source, 0, 0, canvas.width, canvas.height);
            
            const frame = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            const tolerance = parseInt(toleranceSlider.value);

            // 3. Algoritmus
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                let diff = Math.sqrt(
                    Math.pow(r - targetColor.r, 2) + 
                    Math.pow(g - targetColor.g, 2) + 
                    Math.pow(b - targetColor.b, 2)
                );

                if (diff < tolerance) {
                    data[i + 3] = 0; // Úplne priehľadné
                } else if (diff < tolerance + 40) {
                    // Soft edge (vyhladenie a potlačenie zelenej farby na okrajoch)
                    let alpha = ((diff - tolerance) / 40) * 255;
                    data[i + 3] = alpha;
                }
            }

            tempCtx.putImageData(frame, 0, 0);
            
            // 4. Finálny render s filtrom
            ctx.filter = canvas.style.filter || 'none';
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.filter = 'none';
        }

        // Export funkcií
        downloadBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj zdroj obrazu.");
            const link = document.createElement('a');
            link.download = 'vfx_zaber.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        recordBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj zdroj obrazu.");
            
            if (!isRecording) {
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = 'vfx_zaznam.webm';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerHTML = '⏹️ Zastaviť a stiahnuť';
                recordBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerHTML = '🔴 Video (.webm)';
                recordBtn.classList.remove('recording');
            }
        });

        resetBtn.addEventListener('click', function() {
            stopMediaSources();
            fgLoaded = false; bgLoaded = false; isVideoMode = false; isWebcamMode = false;
            document.getElementById('fgUpload').value = '';
            document.getElementById('bgUpload').value = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.filter = 'none';
            cinematicFilter.value = 'none';
            toleranceSlider.value = 100;
            tolValue.textContent = '100';
            targetColor = { r: 0, g: 255, b: 0 };
            webcamBtn.style.borderColor = "var(--border)";
            webcamBtn.style.color = "var(--text-main)";
            canvasHint.style.opacity = '1';
            if(isRecording) recordBtn.click();
        });
    </script>
</body>
</html>
