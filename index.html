<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Studio | Cinematic Chroma Key</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #18181b;
            --bg-input: #27272a;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }
        .back-button {
            background-color: var(--bg-panel);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-button:hover {
            background-color: var(--bg-input);
            border-color: var(--text-muted);
        }

        .studio-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .control-panel {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child { border-bottom: none; padding-bottom: 0; }
        
        h2 { font-size: 1.1rem; margin: 0; color: var(--text-main); font-weight: 600; }
        p.subtitle { margin: -5px 0 10px 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        .btn {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { border-color: var(--accent); background-color: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background-color: var(--danger); color: white; }
        .btn.danger.recording { animation: pulse 1.5s infinite; background-color: var(--danger); color: white;}
        input[type="file"] { display: none; }

        label { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 5px; }
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }
        select:focus { border-color: var(--accent); }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-main);
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-wrapper {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            cursor: grab;
            transition: filter 0.3s ease;
        }
        canvas:active {
            cursor: grabbing;
        }
        .canvas-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            pointer-events: none;
            text-align: center;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @media (max-width: 900px) {
            .studio-container { grid-template-columns: 1fr; }
            .preview-panel { order: -1; } 
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/" class="back-button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Späť na portál
        </a>
    </div>

    <div class="studio-container">
        
        <div class="control-panel">
            <div class="panel-section">
                <h2>1. Zdroj obrazu (Popredie)</h2>
                <p class="subtitle">Nahraj súbor so zeleným plátnom alebo zapni live kameru.</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <label class="btn">
                        🎥 Súbor
                        <input type="file" id="fgUpload" accept="image/*,video/*">
                    </label>
                    <button class="btn" id="webcamBtn">📷 Webkamera</button>
                </div>
            </div>

            <div class="panel-section">
                <h2>2. Prostredie (Pozadie)</h2>
                <p class="subtitle">Vlož filmové prostredie alebo scenériu.</p>
                <label class="btn">
                    🖼️ Nahrať obrázok pozadia
                    <input type="file" id="bgUpload" accept="image/*">
                </label>
            </div>

            <div class="panel-section">
                <h2>3. VFX & Color Grading</h2>
                <div>
                    <label for="tolerance"><span>Tolerancia kľúčovania</span> <span id="tolValue">100</span></label>
                    <input type="range" id="tolerance" min="0" max="255" value="100">
                </div>
                <div style="margin-top: 15px;">
                    <label for="cinematicFilter">Filmový filter (Post-process)</label>
                    <select id="cinematicFilter">
                        <option value="none">Bez filtra (Natural)</option>
                        <option value="contrast(1.2) saturate(1.3)">Akčný Thriller</option>
                        <option value="grayscale(100%) contrast(1.5)">Neo-Noir (Čiernobiele)</option>
                        <option value="sepia(0.8) hue-rotate(90deg) saturate(1.5)">Sci-Fi / Matrix</option>
                        <option value="brightness(0.8) sepia(0.3) saturate(0.8)">Post-Apo</option>
                    </select>
                </div>
            </div>

            <div class="panel-section">
                <h2>4. Export</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <button class="btn" id="downloadBtn">💾 Snímka (.png)</button>
                    <button class="btn danger" id="recordBtn">🔴 Video (.webm)</button>
                </div>
                <button class="btn" id="resetBtn" style="border-color: var(--border);">🔄 Resetovať štúdio</button>
            </div>
        </div>

        <div class="preview-panel">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="1280" height="720" style="background: #000;"></canvas>
                <div class="canvas-hint" id="canvasHint">
                    🖱️ <b>Klik:</b> Výber farby | 🤚 <b>Ťahanie:</b> Posun objektu | ⚙️ <b>Koliesko:</b> Veľkosť
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let fgImage = new Image();
        let bgImage = new Image();
        let fgVideo = document.createElement('video');
        fgVideo.muted = true;
        fgVideo.loop = true;
        fgVideo.setAttribute('playsinline', ''); 

        let fgLoaded = false;
        let bgLoaded = false;
        let isVideoMode = false;
        let isWebcamMode = false;
        let animationFrameId;
        let currentStream = null;

        let targetColor = { r: 0, g: 255, b: 0 }; 

        // --- PREMENNÉ PRE POHYB A ZMENU VEĽKOSTI ---
        let fgState = { x: 0, y: 0, scale: 1 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let dragDistance = 0;
        
        const toleranceSlider = document.getElementById('tolerance');
        const tolValue = document.getElementById('tolValue');
        const cinematicFilter = document.getElementById('cinematicFilter');
        const downloadBtn = document.getElementById('downloadBtn');
        const recordBtn = document.getElementById('recordBtn');
        const resetBtn = document.getElementById('resetBtn');
        const webcamBtn = document.getElementById('webcamBtn');
        const canvasHint = document.getElementById('canvasHint');

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function stopMediaSources() {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            fgVideo.pause();
            fgVideo.removeAttribute('src');
            fgVideo.load();
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // --- VYKRESLENIE POZADIA (COVER) ---
        function drawBackground(context, img) {
            const sw = img.videoWidth || img.width;
            const sh = img.videoHeight || img.height;
            if (!sw || !sh) return;

            const sourceRatio = sw / sh;
            const canvasRatio = canvas.width / canvas.height;
            let drawW, drawH, drawX, drawY;

            if (sourceRatio > canvasRatio) {
                drawH = canvas.height;
                drawW = canvas.height * sourceRatio;
                drawX = (canvas.width - drawW) / 2;
                drawY = 0;
            } else {
                drawW = canvas.width;
                drawH = canvas.width / sourceRatio;
                drawX = 0;
                drawY = (canvas.height - drawH) / 2;
            }
            context.drawImage(img, drawX, drawY, drawW, drawH);
        }

        // --- VYKRESLENIE OBJEKTU S POSUNOM A LUPOM ---
        function drawForeground(context, source) {
            const sw = source.videoWidth || source.width;
            const sh = source.videoHeight || source.height;
            if (!sw || !sh) return;
            
            const sourceRatio = sw / sh;
            const canvasRatio = canvas.width / canvas.height;
            let drawW, drawH;
            
            // Základná veľkosť (Contain)
            if (sourceRatio > canvasRatio) {
                drawW = canvas.width;
                drawH = canvas.width / sourceRatio;
            } else {
                drawH = canvas.height;
                drawW = canvas.height * sourceRatio;
            }

            // Aplikovanie Zoomu (Scale)
            const finalW = drawW * fgState.scale;
            const finalH = drawH * fgState.scale;
            
            // Základné vycentrovanie
            const baseX = (canvas.width - finalW) / 2;
            const baseY = (canvas.height - finalH) / 2;

            if (isWebcamMode) {
                context.save();
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
                // Pri zrkadlovom obraze musíme posun X invertovať, aby myš ťahala správnym smerom
                context.drawImage(source, baseX - fgState.x, baseY + fgState.y, finalW, finalH);
                context.restore();
            } else {
                context.drawImage(source, baseX + fgState.x, baseY + fgState.y, finalW, finalH);
            }
        }

        document.getElementById('fgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            stopMediaSources();
            isWebcamMode = false;
            fgState = { x: 0, y: 0, scale: 1 }; // Reset pozície pri novom súbore
            webcamBtn.style.borderColor = "var(--border)";
            webcamBtn.style.color = "var(--text-main)";
            
            const fileURL = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                isVideoMode = true;
                fgVideo.src = fileURL;
                fgVideo.onloadeddata = () => {
                    fgLoaded = true;
                    fgVideo.play();
                    renderVideoLoop();
                };
            } else {
                isVideoMode = false;
                fgImage.onload = () => {
                    fgLoaded = true;
                    processFrame(fgImage);
                }
                fgImage.src = fileURL;
            }
        });

        webcamBtn.addEventListener('click', async function() {
            try {
                stopMediaSources();
                fgState = { x: 0, y: 0, scale: 1 };
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                currentStream = stream;
                fgVideo.srcObject = stream;
                isVideoMode = true;
                isWebcamMode = true;
                
                this.style.borderColor = "var(--accent)";
                this.style.color = "var(--accent)";

                fgVideo.onloadeddata = () => {
                    fgLoaded = true;
                    fgVideo.play();
                    renderVideoLoop();
                };
            } catch (err) {
                alert("Nepodarilo sa spustiť webkameru. Skontroluj povolenia prehliadača.");
                console.error(err);
            }
        });

        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            bgImage.onload = () => {
                bgLoaded = true;
                if(!isVideoMode) processFrame(fgImage);
            }
            bgImage.src = URL.createObjectURL(file);
        });

        toleranceSlider.addEventListener('input', function() {
            tolValue.textContent = this.value;
            if (!isVideoMode && fgLoaded) processFrame(fgImage);
        });

        cinematicFilter.addEventListener('change', function() {
            canvas.style.filter = this.value;
            if (!isVideoMode && fgLoaded) {
                ctx.filter = this.value;
                processFrame(fgImage);
                ctx.filter = 'none';
            }
        });

        // --- MYŠOVÉ EVENTY (ŤAHANIE, LUPA, KVAPÁTKO) ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
            dragDistance = 0;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !fgLoaded) return;
            
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            dragDistance += Math.abs(dx) + Math.abs(dy); // Sledujeme či išlo o klik alebo posun
            
            // Prepočítanie posunu myši na skutočné pixely canvasu
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            fgState.x += dx * scaleX;
            fgState.y += dy * scaleY;
            lastMouse = { x: e.clientX, y: e.clientY };
            
            if (!isVideoMode) processFrame(fgImage);
        });

        canvas.addEventListener('wheel', (e) => {
            if (!fgLoaded) return;
            e.preventDefault(); // Zabráni scrollovaniu stránky
            
            const zoomSpeed = 0.002;
            const zoomAmount = -e.deltaY * zoomSpeed;
            // Obmedzenie lupy (od 10% po 500% veľkosti)
            fgState.scale = Math.max(0.1, Math.min(5, fgState.scale + zoomAmount));
            
            if (!isVideoMode) processFrame(fgImage);
        }, { passive: false });

        canvas.addEventListener('click', function(e) {
            if (!fgLoaded) return;
            // Ak sme myšou potiahli viac ako 5px, ignorujeme klik (išlo o ťahanie)
            if (dragDistance > 5) return; 

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            let source = isVideoMode ? fgVideo : fgImage;
            
            // Nakreslíme len objekt presne tak, ako je zväčšený a posunutý
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawForeground(ctx, source);
            
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
            
            canvasHint.style.opacity = '0'; // Skryjeme nápovedu po prvom úspešnom kliku
            
            if(!isVideoMode) processFrame(fgImage);
        });

        function renderVideoLoop() {
            if (!isVideoMode) return;
            processFrame(fgVideo);
            animationFrameId = requestAnimationFrame(renderVideoLoop);
        }

        // --- HLAVNÝ PROCESS RENDERU ---
        function processFrame(source) {
            if (!fgLoaded) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (bgLoaded) {
                drawBackground(ctx, bgImage);
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            
            // Nakreslíme objekt do pomocného plátna (so všetkými transformáciami)
            drawForeground(tempCtx, source);
            
            const frame = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            const tolerance = parseInt(toleranceSlider.value);

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                let diff = Math.sqrt(
                    Math.pow(r - targetColor.r, 2) + 
                    Math.pow(g - targetColor.g, 2) + 
                    Math.pow(b - targetColor.b, 2)
                );

                if (diff < tolerance) {
                    data[i + 3] = 0; 
                } else if (diff < tolerance + 40) {
                    let alpha = ((diff - tolerance) / 40) * 255;
                    data[i + 3] = alpha;
                }
            }

            tempCtx.putImageData(frame, 0, 0);
            
            ctx.filter = canvas.style.filter || 'none';
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.filter = 'none';
        }

        downloadBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj zdroj obrazu.");
            const link = document.createElement('a');
            link.download = 'vfx_zaber.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        recordBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj zdroj obrazu.");
            
            if (!isRecording) {
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = 'vfx_zaznam.webm';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerHTML = '⏹️ Zastaviť a stiahnuť';
                recordBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerHTML = '🔴 Video (.webm)';
                recordBtn.classList.remove('recording');
            }
        });

        resetBtn.addEventListener('click', function() {
            stopMediaSources();
            fgLoaded = false; bgLoaded = false; isVideoMode = false; isWebcamMode = false;
            fgState = { x: 0, y: 0, scale: 1 };
            document.getElementById('fgUpload').value = '';
            document.getElementById('bgUpload').value = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.filter = 'none';
            cinematicFilter.value = 'none';
            toleranceSlider.value = 100;
            tolValue.textContent = '100';
            targetColor = { r: 0, g: 255, b: 0 };
            webcamBtn.style.borderColor = "var(--border)";
            webcamBtn.style.color = "var(--text-main)";
            canvasHint.style.opacity = '1';
            if(isRecording) recordBtn.click();
        });
    </script>
</body>
</html>
