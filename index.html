<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-based Chroma Key & VFX Studio</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0f0f11;
            --panel: #1a1a1d;
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-button {
            align-self: flex-start;
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .back-button:hover { background-color: #555; }
        .container {
            background-color: var(--panel);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; color: var(--primary); letter-spacing: 1px; }
        .controls, .fx-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .upload-btn, .action-btn {
            background: #2c2c2c;
            border: 2px dashed #555;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }
        .upload-btn:hover { border-color: var(--primary); }
        .action-btn { border: 2px solid var(--primary); color: var(--primary); font-weight: bold; background: transparent; }
        .action-btn:hover { background: var(--primary); color: #000; }
        
        /* Špecifické farby pre nové tlačidlá */
        #recordBtn { border-color: #ff4444; color: #ff4444; }
        #recordBtn:hover { background: #ff4444; color: white; }
        #recordBtn.recording { background: #ff4444; color: white; animation: pulse 1.5s infinite; }
        
        #resetBtn { border-color: #ffaa00; color: #ffaa00; }
        #resetBtn:hover { background: #ffaa00; color: #000; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        input[type="file"] { display: none; }
        select {
            padding: 10px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            outline: none;
        }
        canvas {
            max-width: 100%;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.1);
            cursor: crosshair;
            transition: filter 0.3s ease;
        }
    </style>
</head>
<body>

    <a href="/" class="back-button">Späť</a>

    <div class="container">
        <h1>VFX Chroma Key & Color Grading Studio</h1>
        <p>Vystrihni pozadie z videa, aplikuj filter a vyexportuj hotový klip.</p>
        
        <div class="controls">
            <label class="upload-btn">
                🎥 Nahrať objekt (Obraz/Video)
                <input type="file" id="fgUpload" accept="image/*,video/*">
            </label>
            <label class="upload-btn">
                🖼️ Nahrať nové pozadie (Obraz)
                <input type="file" id="bgUpload" accept="image/*">
            </label>
            <button class="action-btn" id="resetBtn">🔄 Reset scény</button>
        </div>

        <div class="fx-controls">
            <label>Tolerancia (<span id="tolValue">100</span>): 
                <input type="range" id="tolerance" min="0" max="255" value="100">
            </label>
            <label>Filter: 
                <select id="cinematicFilter">
                    <option value="none">Bez filtra (Natural)</option>
                    <option value="contrast(1.2) saturate(1.3)">Akčný Thriller</option>
                    <option value="grayscale(100%) contrast(1.5)">Neo-Noir</option>
                    <option value="sepia(0.8) hue-rotate(90deg) saturate(1.5)">Sci-Fi / Matrix</option>
                    <option value="brightness(0.8) sepia(0.3) saturate(0.8)">Post-Apo</option>
                </select>
            </label>
            <button class="action-btn" id="downloadBtn">💾 Snímka</button>
            <button class="action-btn" id="recordBtn">🔴 Nahrávať video</button>
        </div>

        <canvas id="canvas" width="800" height="450"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let fgImage = new Image();
        let bgImage = new Image();
        let fgVideo = document.createElement('video');
        fgVideo.muted = true;
        fgVideo.loop = true;

        let fgLoaded = false;
        let bgLoaded = false;
        let isVideoMode = false;
        let animationFrameId;

        let targetColor = { r: 0, g: 255, b: 0 }; 
        
        // Elementy
        const toleranceSlider = document.getElementById('tolerance');
        const tolValue = document.getElementById('tolValue');
        const cinematicFilter = document.getElementById('cinematicFilter');
        const downloadBtn = document.getElementById('downloadBtn');
        const recordBtn = document.getElementById('recordBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Premenné pre nahrávanie videa
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // Nahrávanie popredia
        document.getElementById('fgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                isVideoMode = true;
                fgVideo.src = fileURL;
                fgVideo.onloadeddata = () => {
                    canvas.width = fgVideo.videoWidth;
                    canvas.height = fgVideo.videoHeight;
                    fgLoaded = true;
                    fgVideo.play();
                    renderVideoLoop();
                };
            } else {
                isVideoMode = false;
                if(animationFrameId) cancelAnimationFrame(animationFrameId);
                fgImage.onload = () => {
                    canvas.width = fgImage.width;
                    canvas.height = fgImage.height;
                    fgLoaded = true;
                    processFrame(fgImage);
                }
                fgImage.src = fileURL;
            }
        });

        // Nahrávanie pozadia
        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            bgImage.onload = () => {
                bgLoaded = true;
                if(!isVideoMode) processFrame(fgImage);
            }
            bgImage.src = URL.createObjectURL(file);
        });

        // Event Listenery pre interakciu
        toleranceSlider.addEventListener('input', function() {
            tolValue.textContent = this.value;
            if (!isVideoMode && fgLoaded) processFrame(fgImage);
        });

        cinematicFilter.addEventListener('change', function() {
            canvas.style.filter = this.value;
        });

        canvas.addEventListener('click', function(e) {
            if (!fgLoaded) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            let source = isVideoMode ? fgVideo : fgImage;
            ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
            
            if(!isVideoMode) processFrame(fgImage);
        });

        // Jadro renderingu
        function renderVideoLoop() {
            if (!isVideoMode) return;
            processFrame(fgVideo);
            animationFrameId = requestAnimationFrame(renderVideoLoop);
        }

        function processFrame(source) {
            if (!fgLoaded) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgLoaded) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            
            tempCtx.drawImage(source, 0, 0, canvas.width, canvas.height);
            const frame = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            const tolerance = parseInt(toleranceSlider.value);

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                let diff = Math.sqrt(
                    Math.pow(r - targetColor.r, 2) + 
                    Math.pow(g - targetColor.g, 2) + 
                    Math.pow(b - targetColor.b, 2)
                );

                if (diff < tolerance) {
                    data[i + 3] = 0; 
                } else if (diff < tolerance + 30) {
                    data[i + 3] = ((diff - tolerance) / 30) * 255;
                }
            }

            tempCtx.putImageData(frame, 0, 0);
            
            // Kreslenie s aplikovaním CSS filtra priamo na kontext (dôležité pre video export)
            ctx.filter = canvas.style.filter || 'none';
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.filter = 'none'; // reset pre ďalší frame
        }

        // --- NOVÉ FUNKCIE ---

        // 1. Resetovanie scény
        resetBtn.addEventListener('click', function() {
            fgLoaded = false;
            bgLoaded = false;
            isVideoMode = false;
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            
            fgVideo.pause();
            fgVideo.removeAttribute('src');
            fgVideo.load();
            
            document.getElementById('fgUpload').value = '';
            document.getElementById('bgUpload').value = '';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.filter = 'none';
            cinematicFilter.value = 'none';
            toleranceSlider.value = 100;
            tolValue.textContent = '100';
            targetColor = { r: 0, g: 255, b: 0 };
            
            if(isRecording) recordBtn.click(); // Ak nahráva, zastav to
        });

        // 2. Snímka (Screenshot)
        downloadBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj objekt.");
            const link = document.createElement('a');
            link.download = 'vfx_zaber.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // 3. Nahrávanie a export videa
        recordBtn.addEventListener('click', function() {
            if(!fgLoaded) return alert("Najskôr nahraj video alebo obrázok na nahrávanie.");
            
            if (!isRecording) {
                // Začiatok nahrávania
                const stream = canvas.captureStream(30); // 30 FPS
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = 'vfx_zaber.webm';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = '⏹️ Zastaviť a stiahnuť';
                recordBtn.classList.add('recording');
            } else {
                // Koniec nahrávania
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = '🔴 Nahrávať video';
                recordBtn.classList.remove('recording');
            }
        });
    </script>
</body>
</html>
